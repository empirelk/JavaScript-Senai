<body>
    <h1> TROCAR AS IMAGENS </h1>
    <hr> 
    <input type="button" onclick="bravo()" value="feliz">
    <input type="button" onclick="triste()" value="triste">
    <img src="angry.jpg.png" id="rosto" style="width: 350px;">

    <script>
        function bravo(){
            const tag_img = document.getElementById('rosto');
            tag_img.src = "smile.jpg.jpg";
            tag_img.title = "happy";
        }
        function triste(){
            const tag_img = document.getElementById('rosto');
            tag_img.src = "angry.jpg.png";
            tag_img.title = "sad";
        }
    </script>
</body>
</html>
