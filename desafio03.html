<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="ddot.jpg">
    <title>DESAFIO 02</title>
    <meta name="description" content="...">
    <meta name="keywords" content="sites, web, frontend">
    <meta name="author" content="Gustavo Agostinho, gustahsantos2008@gmail.com">
</head>
<body>
    <h1>DESAFIO 02</h1>
    <hr>
    <div>
        <p>ESTAMOS APRENDENDO JAVASCRIPT</p>
        <hr>
        <p>Agora vamos mostrar a imagem do desafio.</p>
    </div>
    <div style="text-align:center; margin-top:20px;">
        <img src="ddot.jpg" alt="DDOT" style="width:420px; max-width:100%; border-radius:12px;" />
        <button onclick="trocar_imagem()">Trocar Imagem</button>
        <img src="DD-OSAMA.jpg" alt="DD" style="width:420px; max-width:100%; border-radius:12px;" />
        <button onclick="trocar_imagem()">Trocar Imagem</button>
    </div>
    <script>
     function trocar_imagem(){
        const tag_img = document.getElementsByTagName('img');
        for(let i = 0; i < tag_img.length; i++){
            if(tag_img[i].src.includes("ddot.jpg")){
                tag_img[i].src = "DD-OSAMA.jpg";
            } else {
                tag_img[i].src = "ddot.jpg";
            }
        }
     }        
        
    </script>
</body>
</html>
